<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <title>Form Builder</title>
</head>

<body>
    <header class="form-header">
        <div class="form-header-left">
            <img class="form-icon" src="assets/form-icon.svg" alt="form-icon" />
            <input class="form-headline" type="text" value="Untitled form" />
        </div>
        <ul class="form-header-right">
            <li class="theme-switcher">
                <button class="material-symbols-outlined icon-button" id="theme-icon-button" aria-label="Change theme">
                    palette
                </button>
                <div class="theme-toggle">
                    <div id="dark-theme"></div>
                    <div id="purple-theme"></div>
                    <div id="red-theme"></div>
                </div>
            </li>
            <li>
                <button class="material-symbols-outlined icon-button" id="undo-button" aria-label="Change theme">
                    undo
                </button>
            </li>
            <li>
                <button class="material-symbols-outlined icon-button" id="redo-button" aria-label="Change theme">
                    redo
                </button>
            </li>
            <li>
                <button class="clear-button" aria-label="Clear Form">Clear form</button>
            </li>
            <li>
                <button class="publish-button" aria-label="Publish Form">
                    Publish
                </button>
            </li>
            <!-- <div class="user-profile"> -->
            <!-- <img src="" alt="User Profile"> -->
            <!-- </div> -->
        </ul>
    </header>
    <main class="form-content">
        <!--  form title & form description section-->
        <form class="form-container">
            <section class="form-content-header">
                <input type="text" class="form-title-input label-title" value="Untitled form" />
                <ul class="toolbar">
                    <li>
                        <button type="button" class="material-symbols-outlined">
                            format_bold
                        </button>
                    </li>
                    <li>
                        <button type="button" class="material-symbols-outlined">
                            format_italic
                        </button>
                    </li>
                    <li>
                        <button type="button" class="material-symbols-outlined">
                            format_underlined
                        </button>
                    </li>
                    <li>
                        <button type="button" class="material-symbols-outlined">
                            format_clear
                        </button>
                    </li>
                </ul>
                <textarea name="form-description" class="form-description label-description"
                    placeholder="Form description"></textarea>
            </section>
            <!-- Multiple choice question card -->
            <div role="group" aria-label="mcq-question" class="questions-card">
                <div class="drag-handle" aria-label="Drag to reorder"><span
                        class="material-symbols-outlined drag-icon">drag_indicator</span></div>
                <div class="question-header">
                    <input type="text" class="question-input label-large" placeholder="Question"
                        aria-label="Question Heading" />
                    <label class="material-symbols-outlined upload-icon">image
                        <input type="file" class="image-upload" />
                    </label>

                    <div class="custom-select">
                        <div class="select-button">
                            <span class="selected-option">Select Option</span>
                            <i class="material-symbols-outlined">arrow_drop_down</i>
                        </div>
                        <ul class="options-type">
                            <li class="option-type selected" data-value="multipleChoice">
                                <i class="material-symbols-outlined">radio_button_checked</i> <span>Multiple
                                    choice</span>
                            </li>
                            <li class="option-type " data-value="checkBoxes">
                                <i class="material-symbols-outlined">check_box</i> <span>Checkboxes</span>
                            </li>
                            <li class="option-type" data-value="dropDown">
                                <i class="material-symbols-outlined">arrow_drop_down_circle</i> <span>Dropdown</span>
                            </li>
                            <li class="option-type" data-value="multipleChoiceGrid">
                                <i class="material-symbols-outlined">apps</i> <span>Multiple choice grid</span>
                            </li>
                            <li class="option-type" data-value="linearScale">
                                <i class="material-symbols-outlined">linear_scale</i> <span>Linear scale</span>
                            </li>
                            <li class="option-type" data-value="date">
                                <i class="material-symbols-outlined">event</i> <span>Date</span>
                            </li>
                            <li class="option-type" data-value="time">
                                <i class="material-symbols-outlined">access_time</i> <span>Time</span>
                            </li>
                            <li class="option-type" data-value="rating">
                                <i class="material-symbols-outlined">star</i> <span>Rating</span>
                            </li>
                        </ul>
                    </div>
                </div>
                <ul class="question-options">
                    <li class="option">
                        <input type="radio" name="mcq" disabled />
                        <input type="text" class="option-input label-medium" value="Option 1" />
                        <button type="button" class="material-symbols-outlined icon-button"
                            aria-label="remove-option">close</button>
                    </li>
                    <li class="option add-option-button">
                        <input type="radio" name="mcq" disabled />
                        <button type="button" class="add-option-button label-small">Add option</button>
                    </li>
                </ul>
                <div class="question-actions">
                    <button type="button" class="material-symbols-outlined icon-button"
                        aria-label="copy-question-button">content_copy</button>
                    <button type="button" class="material-symbols-outlined icon-button"
                        aria-label="delete-question-button">delete</button>
                    <div class="hor-line"></div>
                    <label aria-label="required-option" class="required-option">
                        <span class="required">Required</span>
                        <input type="checkbox" class="required-toggle" />
                    </label>
                </div>
            </div>
            <button type="button" id="add-question-button">
                Add Question
            </button>
        </form>
    </main>
    <script src="script.js"></script>
</body>

</html>
